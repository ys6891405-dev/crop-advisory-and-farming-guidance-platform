<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Recommendation | Farmers Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <!-- Navigation Bar -->

    <header>

        <div class="container">

            <h2>🌾 Farmers Platform</h2>

            <nav>

                <a href="/">Home</a>

                <a href="/dashboard">Dashboard</a>

            </nav>

        </div>

    </header>



    <!-- Main Content -->

    <main class="container">

        <section class="dashboard-header">

            <h1>🌾 Crop Recommendation</h1>

            <p>
                Enter your farming conditions to get a suitable
                crop recommendation.
            </p>

        </section>



        <!-- Farming Details -->

        <div class="service-card">

            <h2>Enter Farming Details</h2>


            <form>

                <!-- Soil -->

                <label for="soil">
                    Soil Type
                </label>

                <select id="soil" name="soil">

                    <option value="">
                        Select Soil Type
                    </option>

                    <option value="clay">
                        Clay Soil
                    </option>

                    <option value="sandy">
                        Sandy Soil
                    </option>

                    <option value="loamy">
                        Loamy Soil
                    </option>

                    <option value="black">
                        Black Soil
                    </option>

                    <option value="red">
                        Red Soil
                    </option>

                </select>



                <!-- Season -->

                <label for="season">
                    Season
                </label>

                <select id="season" name="season">

                    <option value="">
                        Select Season
                    </option>

                    <option value="kharif">
                        Kharif
                    </option>

                    <option value="rabi">
                        Rabi
                    </option>

                    <option value="summer">
                        Summer
                    </option>

                </select>



                <!-- Water -->

                <label for="water">
                    Water Availability
                </label>

                <select id="water" name="water">

                    <option value="">
                        Select Water Availability
                    </option>

                    <option value="low">
                        Low
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>



                <!-- Land -->

                <label for="land">
                    Land Type
                </label>

                <select id="land" name="land">

                    <option value="">
                        Select Land Type
                    </option>

                    <option value="dry">
                        Dry Land
                    </option>

                    <option value="wet">
                        Wet Land
                    </option>

                    <option value="irrigated">
                        Irrigated Land
                    </option>

                </select>



                <!-- Button -->

                <button type="button"
                        onclick="showRecommendation()">

                    🌱 Get Crop Recommendation

                </button>

            </form>



            <!-- Recommendation Result -->

            <div id="result" style="display:none;">

                <h2>Recommended Crop 🌾</h2>

                <div id="recommendationText"></div>

            </div>

        </div>

    </main>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 Farmers Platform |
            Smart Agriculture for a Better Future 🌱
        </p>

    </footer>



    <!-- Recommendation Logic -->

    <script>

        function showRecommendation() {


            const soil =
                document.getElementById("soil").value;


            const season =
                document.getElementById("season").value;


            const water =
                document.getElementById("water").value;


            const result =
                document.getElementById("result");


            const recommendation =
                document.getElementById("recommendationText");



            /* Check user input */

            if (soil === "" ||
                season === "" ||
                water === "") {

                alert(
                    "Please select Soil Type, Season and Water Availability."
                );

                return;

            }



            let crop = "";

            let reason = "";

            let soilInfo = "";

            let waterInfo = "";

            let otherCrops = "";

            let tip = "";



            /* BLACK SOIL */

            if (soil === "black") {


                if (season === "rabi") {

                    crop = "Wheat";

                    reason =
                        "Black soil has good moisture-holding capacity and can support wheat cultivation during the Rabi season.";

                    soilInfo =
                        "Black soil retains moisture and contains useful minerals.";

                    waterInfo =
                        "Wheat generally requires moderate and well-managed irrigation.";

                    otherCrops =
                        "Chickpea, Mustard and Lentil";

                    tip =
                        "Maintain proper soil moisture and avoid excessive irrigation.";

                }


                else {

                    crop = "Cotton";

                    reason =
                        "Black soil is well suited for crops such as cotton because of its moisture-retaining properties.";

                    soilInfo =
                        "Black soil is commonly associated with cotton-growing regions.";

                    waterInfo =
                        "Moderate water availability with proper irrigation management is helpful.";

                    otherCrops =
                        "Sorghum, Soybean and Groundnut";

                    tip =
                        "Ensure good drainage and monitor soil moisture regularly.";

                }

            }



            /* SANDY SOIL */

            else if (soil === "sandy") {


                if (water === "low") {

                    crop = "Millet";

                    reason =
                        "Millets are relatively well adapted to sandy soils and lower water availability.";

                    soilInfo =
                        "Sandy soil provides good drainage and can suit drought-tolerant crops.";

                    waterInfo =
                        "Millets can perform with comparatively lower water availability.";

                    otherCrops =
                        "Groundnut, Pulses and Sorghum";

                    tip =
                        "Use organic matter or compost to improve water retention.";

                }


                else {

                    crop = "Groundnut";

                    reason =
                        "Groundnut can grow well in light, well-drained sandy soil when adequate moisture is available.";

                    soilInfo =
                        "Sandy soil allows good drainage and easier development of groundnut pods.";

                    waterInfo =
                        "Moderate water availability supports healthy growth.";

                    otherCrops =
                        "Millet, Watermelon and Pulses";

                    tip =
                        "Avoid waterlogging and maintain suitable soil moisture.";

                }

            }



            /* LOAMY SOIL */

            else if (soil === "loamy") {

                crop = "Rice";

                reason =
                    "Loamy soil contains a balanced mixture of sand, silt and clay and can support many crops.";

                soilInfo =
                    "Loamy soil generally provides good drainage while retaining sufficient nutrients and moisture.";

                waterInfo =
                    "Rice requires adequate water availability, especially during important growth stages.";

                otherCrops =
                    "Wheat, Maize and Vegetables";

                tip =
                    "Maintain soil fertility by using organic manure and balanced fertilizers.";

            }



            /* CLAY SOIL */

            else if (soil === "clay") {

                crop = "Rice";

                reason =
                    "Clay soil has a high water-holding capacity, making it suitable for crops that need more moisture.";

                soilInfo =
                    "Clay soil retains water effectively but should have proper drainage management.";

                waterInfo =
                    "Higher water availability is generally suitable for rice cultivation.";

                otherCrops =
                    "Wheat, Pulses and Vegetables";

                tip =
                    "Avoid excessive waterlogging and maintain proper field drainage.";

            }



            /* RED SOIL */

            else if (soil === "red") {


                if (season === "kharif") {

                    crop = "Groundnut";

                    reason =
                        "Red soil is generally well drained and can support groundnut cultivation during suitable seasons.";

                    soilInfo =
                        "Red soil can support crops when adequate nutrients and organic matter are maintained.";

                    waterInfo =
                        "Moderate water availability is helpful for healthy crop development.";

                    otherCrops =
                        "Millet, Pulses and Maize";

                    tip =
                        "Adding organic matter can improve soil fertility and moisture retention.";

                }


                else {

                    crop = "Millet";

                    reason =
                        "Millets can adapt to relatively well-drained soils and can be suitable for different growing conditions.";

                    soilInfo =
                        "Red soil generally provides good drainage.";

                    waterInfo =
                        "Moderate or lower water availability can be suitable depending on the millet variety.";

                    otherCrops =
                        "Groundnut, Pulses and Maize";

                    tip =
                        "Use balanced nutrients and monitor moisture during crop development.";

                }

            }



            /* DISPLAY RESULT */

            recommendation.innerHTML = `

                <div class="recommendation-result">

                    <h2>
                        🌾 Recommended Crop: ${crop}
                    </h2>

                    <h3>
                        💡 Why is it suitable?
                    </h3>

                    <p>
                        ${reason}
                    </p>


                    <h3>
                        🌱 Soil Suitability
                    </h3>

                    <p>
                        ${soilInfo}
                    </p>


                    <h3>
                        💧 Water Requirement
                    </h3>

                    <p>
                        ${waterInfo}
                    </p>


                    <h3>
                        🌿 Other Suitable Crops
                    </h3>

                    <p>
                        ${otherCrops}
                    </p>


                    <h3>
                        👨‍🌾 Farming Tip
                    </h3>

                    <p>
                        ${tip}
                    </p>

                </div>

            `;


            result.style.display = "block";

        }

    </script>

</body>

</html>
