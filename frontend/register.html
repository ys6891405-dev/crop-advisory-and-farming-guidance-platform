<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Farmers Platform</title>

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <h2 class="logo">🌱 Farmers Platform</h2>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>
    </nav>


    <!-- Registration Form -->
    <section class="form-section">

        <div class="form-container">

            <h2>Create Your Account 🌾</h2>

            <p>Join the Farmers Platform and access smart farming services.</p>

            <form action="/register" method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <p class="form-link">
                Already have an account?
                <a href="/login">Login here</a>
            </p>

        </div>

    </section>

</body>
</html>
